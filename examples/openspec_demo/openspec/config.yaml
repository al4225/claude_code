schema: spec-driven

context: |
  Python package for GWAS summary statistics used in statistical genetics pipelines.
  Inputs are pandas DataFrames with columns CHR, POS, A1 (effect allele), A2, BETA, SE.
  Correctness of effect direction matters more than speed: a silent sign flip corrupts
  downstream fine-mapping and colocalization. Prefer failing loudly over guessing.
  Every behavior change needs a pytest test, including a simulated-data check where relevant.

rules:
  proposal:
    - State what is out of scope
  tasks:
    - Include explicit test tasks for edge cases (strand-ambiguous SNPs, missing values)

